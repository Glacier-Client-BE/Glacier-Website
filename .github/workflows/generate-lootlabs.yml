name: Generate LootLabs Links

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-lootlabs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate LootLabs links
        env:
          LOOTLABS_API_TOKEN: ${{ secrets.LOOTLABS_API_TOKEN }}
        run: python .github/scripts/generate-lootlabs.py

      - name: Commit changes
        run: |
          if git diff --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/downloads.json assets/data/launcher.json
          git commit -m "chore: add LootLabs links to downloads"
          git push || { git pull --rebase origin "${GITHUB_REF_NAME}"; git push; }
